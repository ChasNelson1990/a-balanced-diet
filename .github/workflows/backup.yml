name: backup

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Mask password
        run: |
          echo "::add-mask::$SUPABASE_DB_PASSWORD"
          echo "::add-mask::$(python3 -c 'import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1],safe=""))' "$SUPABASE_DB_PASSWORD")"
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 3.1.0
      - run: sudo apt-get update && sudo apt-get install -y age postgresql-client
      - name: Dump and encrypt
        env:
          RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: scripts/backup/dump.sh backup-out
      - uses: actions/upload-artifact@v4
        with:
          name: backup-${{ github.run_id }}
          path: backup-out/*.age
          retention-days: 90
          if-no-files-found: error
